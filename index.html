<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>메인트 편집기-v2</title>
<link rel="icon" type="image/png" sizes="32x32" href="icon/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icon/icon-16.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon/icon-180.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<!-- Galmuri: 픽셀 한글 폰트 (SIL OFL) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css">
<style>
  :root{
    /* 스테이지 색 — 상단 컨트롤에서 실시간 변경 */
    --bg:#eef4fd;
    --dot:#c9dcf6;
    --line:#7cb0e8;        /* 창 테두리 / 구분선 */
    --line-soft:#b3d1f2;   /* 창선을 흰색 쪽으로 옅게 푼 색 — 점선 테두리용 (applyColors) */
    --ink:#3f4d5e;         /* 본문 글자색 */
    --c1:#a9d3f4;  --c1t:#4a7fa8;   /* 색 1 (파랑) */
    --c2:#c5b0ec;  --c2t:#6f5aa0;   /* 색 2 (보라) */
    --c3:#f7c3d8;  --c3t:#b06a8b;   /* 색 3 (분홍) */
    /* 창 상·하단 바 그라데이션 — 창선 색에서 자동으로 만들어짐 (applyColors) */
    --bar-top:linear-gradient(180deg, rgba(124,176,232,0.55), rgba(124,176,232,0.08) 75%, rgba(124,176,232,0.02));
    --bar-bot:linear-gradient(180deg, rgba(124,176,232,0.55), rgba(124,176,232,0.08) 75%, rgba(124,176,232,0.02));
    --font:'Galmuri14';
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:#dfe9f7; color:#42506a; padding:24px 16px 60px;
    font-family:'Galmuri11','Galmuri14',monospace;
    font-size:11px; line-height:1.6;
    display:flex; flex-direction:column; align-items:center; gap:16px;
  }

  /* ───────── 상단 컨트롤 ───────── */
  .panel{
    width:100%; max-width:1200px; background:#fff; border:2px solid #b9d3f0;
    border-radius:10px; padding:14px 16px; display:flex; flex-wrap:wrap;
    gap:10px 18px; align-items:center;
  }
  .panel .grp{display:flex; align-items:center; gap:7px;}
  .panel .grp + .grp{border-left:1px dashed #cfe0f5; padding-left:18px;}
  .panel label{color:#7288a8;}
  button{
    font-family:inherit; font-size:11px; color:#3f4d5e; cursor:pointer;
    background:#eaf3ff; border:1px solid #b9d3f0; border-radius:6px;
    padding:6px 10px; line-height:1.4;
  }
  button:hover{background:#dbebff;}
  button.on{background:#7cb0e8; border-color:#7cb0e8; color:#fff;}
  button.danger{background:#fff2f6; border-color:#f0bccb; color:#b0506e;}
  button.danger:hover{background:#ffe4ec;}
  .save-state{color:#8ea3c0; min-width:118px;}
  input[type=color]{
    width:30px; height:24px; padding:0; border:1px solid #b9d3f0;
    border-radius:5px; background:#fff; cursor:pointer;
  }
  input[type=range]{width:74px; accent-color:#7cb0e8; cursor:pointer;}
  select{
    font-family:inherit; font-size:11px; padding:5px 6px; color:#3f4d5e;
    border:1px solid #b9d3f0; border-radius:6px; background:#fff;
  }
  .hint{color:#8ea3c0; text-align:center; max-width:1200px; line-height:1.9;}

  /* ───────── 스테이지 ───────── */
  .stage-wrap{overflow:auto; max-width:100%; padding:4px;}
  .zoomer{transform-origin:top left;}
  .stage{
    position:relative; width:1200px; min-height:900px;
    background-color:var(--bg); background-repeat:repeat;
    padding:46px 50px; display:flex; align-items:flex-start; gap:44px;
    font-family:var(--font),'Galmuri11',monospace; color:var(--ink);
    font-size:14px; line-height:1.85;
  }

  /* 편집 가능한 영역 공통 */
  [contenteditable]{outline:none;}
  [contenteditable]:hover{background:rgba(124,176,232,0.10); border-radius:3px;}
  [contenteditable]:focus{background:rgba(124,176,232,0.18); border-radius:3px;}
  [contenteditable]:empty:before{content:attr(data-ph); color:#a9bdd6;}
  .stage.capturing [contenteditable]:hover,
  .stage.capturing [contenteditable]:focus{background:transparent;}
  .stage.capturing .ui-only{display:none !important;}
  /* 저장할 때는 편집용 버튼들이 사라져 내용이 짧아지는데, min-height 900px이 남아
     아래쪽에 빈 배경이 길게 붙었다. 저장 시에는 내용 높이에 맞춰 잘리게 함 */
  .stage.capturing{min-height:0;}
  /* 비워둔 칸의 안내 문구(문구/내용을 입력하세요…)가 저장 이미지에 찍히지 않게 */
  .stage.capturing [contenteditable]:empty:before{content:"";}
  .stage.capturing .frame.empty{border-color:transparent; background:transparent;}
  .stage.capturing .frame.empty .ph{display:none;}

  /* 색칠(배경) / 글자색 */
  .hl{border-radius:2px; padding:0 3px;}
  .hl.c1{background:var(--c1);} .hl.c2{background:var(--c2);} .hl.c3{background:var(--c3);}
  .tx.c1{color:var(--c1t);} .tx.c2{color:var(--c2t);} .tx.c3{color:var(--c3t);}

  /* ───────── 왼쪽 열 ───────── */
  .left-col{width:326px; flex:0 0 326px; display:flex; flex-direction:column; align-items:center;}
  /* 프로필 사진: 위치·크기 고정 (드래그로 옮겨지지 않음, 안쪽 사진만 조절) */
  .profile{
    width:240px; height:240px; flex:0 0 240px; border-radius:50%;
    overflow:hidden; position:relative; background:#ffffff;
    margin:34px 0 42px;
  }
  .info-box{
    width:100%; background:#ffffff;
    border:2px dashed var(--line-soft); border-radius:4px; padding:26px 20px; text-align:center;
  }
  .info-box .sep{border:0; border-top:1px solid var(--line-soft); margin:0 6px;}
  .info-box .blk{margin:0;}
  /* 칸·구분선마다 지우기 버튼을 띄우기 위해 한 겹 감쌈 */
  #infoItems > div{position:relative; margin-bottom:16px;}
  #infoItems > div:last-child{margin-bottom:0;}
  #infoItems .row-ui{position:absolute; top:-4px; right:-8px; display:none;}
  #infoItems > div:hover .row-ui{display:flex;}

  /* ───────── 창 ───────── */
  .win{
    flex:1 1 auto; min-width:0; border:2px solid var(--line); border-radius:8px;
    background:#fff; box-shadow:3px 3px 0 rgba(124,176,232,0.20); overflow:hidden;
  }
  .win-bar{
    display:flex; align-items:center; gap:15px; padding:8px 14px;
    background:var(--bar-top); border-bottom:2px solid var(--line);
  }
  .win-foot{
    display:flex; align-items:center; justify-content:flex-end; gap:18px;
    padding:8px 16px; background:var(--bar-bot);
    border-top:2px solid var(--line);
  }
  /* 창 위·아래 아이콘: 글자가 아니라 그림이라 편집되지 않음.
     색은 applyColors()에서 창선 색으로 직접 칠해준다 (html2canvas가
     SVG를 따로 그려서 currentColor를 물려받지 못하기 때문) */
  .ic{width:20px; height:20px; display:block; flex:0 0 auto; user-select:none;}
  .win-foot .ic{width:21px; height:21px;}
  .win-body{padding:18px 26px 22px;}

  /* 범례 */
  .legend{display:flex; flex-wrap:wrap; align-items:flex-start; gap:12px 26px; padding:2px 0 14px;}
  .deco{flex:1 1 180px; min-width:140px; color:var(--line); font-size:14px; word-break:break-all;}
  .lg-item{display:flex; align-items:flex-start; gap:10px; position:relative;}
  .lg-item .sw{width:56px; height:20px; border-radius:3px; flex:0 0 56px; margin-top:4px;}
  .lg-item .sw.c1{background:var(--c1);}
  .lg-item .sw.c2{background:var(--c2);}
  .lg-item .sw.c3{background:var(--c3);}
  .lg-item .lg-txt{max-width:210px; font-size:14px; line-height:1.5;}
  .lg-item .row-ui{position:absolute; top:-10px; right:-10px; display:none; gap:3px;}
  .lg-item:hover .row-ui{display:flex;}

  hr.divider{border:0; border-top:2px solid var(--line); margin:16px 0;}

  /* 섹션 / 줄 */
  .section{margin-bottom:20px; position:relative;}
  .section:last-of-type{margin-bottom:0;}
  .sec-title{font-size:14px;}
  .line{position:relative; padding-right:30px;}
  .line .row-ui{position:absolute; top:3px; right:0; display:none;}
  .line:hover .row-ui{display:flex;}
  .sec-ui{position:absolute; top:-4px; right:-4px; display:none; gap:4px;}
  .section:hover > .sec-ui{display:flex;}
  .mini{
    font-size:10px; line-height:1; padding:3px 5px; border-radius:4px;
    background:#fff; border:1px solid var(--line); color:var(--line); cursor:pointer;
    font-family:'Galmuri11',monospace; white-space:nowrap;
  }
  .mini:hover{background:var(--line); color:#fff;}
  .mini-sel{
    font-size:10px; padding:2px 4px; border-radius:4px;
    background:#fff; border:1px solid var(--line); color:var(--line);
    font-family:'Galmuri11',monospace;
  }
  .adder{margin-top:8px;}
  .adder .lbl{font-family:'Galmuri11',monospace; font-size:10px; color:var(--line); margin-left:12px;}

  /* ───────── 캐릭터 카드 ───────── */
  /* 한 줄에 몇 칸을 둘지는 .chars의 max-width로 정한다.
     flex-wrap이라 3장·5장처럼 홀수로 남는 마지막 줄도 가운데로 모임 */
  .chars{
    --cw:206px; --aw:180px;
    display:flex; flex-wrap:wrap; justify-content:center; align-items:flex-start;
    gap:26px 18px; padding:8px 0 4px; margin:0 auto;
  }
  .chars[data-per="4"]{--cw:155px; --aw:140px;}
  .char{
    position:relative; width:var(--cw); display:flex; flex-direction:column; align-items:center;
    padding-top:22px;
  }
  .card-ui{position:absolute; top:0; right:2px; display:none; gap:4px; z-index:6;}
  .char:hover .card-ui{display:flex;}
  .avatar{
    width:var(--aw); height:var(--aw); border-radius:18px; overflow:hidden; position:relative;
    background:#f2f7fe; flex:0 0 var(--aw);
  }
  .char .meta{margin-top:12px; text-align:center; width:100%;}
  .char .src, .char .desc, .char .note{font-size:14px; line-height:1.6;}

  /* 이미지 프레임 공통 (아바타 / 스티커) */
  .frame{cursor:grab; user-select:none;}
  .frame.dragging{cursor:grabbing;}
  .frame.empty{
    border:2px dashed var(--line-soft); background:#f6faff; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .frame.empty .ph{color:var(--line-soft); font-size:11px; font-family:'Galmuri11',monospace; text-align:center;}
  .frame img{
    position:absolute; top:50%; left:50%; max-width:none;
    user-select:none; -webkit-user-drag:none; pointer-events:none;
  }
  /* 프레임이 원형이면 overflow:hidden 때문에 모서리에 둔 버튼이 잘려 안 보인다.
     항상 프레임 안쪽 아래 가운데에 둬서 어떤 모양이든 보이고 눌리게 함 */
  .fr-ui{
    position:absolute; left:50%; bottom:8px; transform:translateX(-50%);
    display:none; gap:4px; z-index:7;
  }
  .frame:hover .fr-ui{display:flex;}

  /* ───────── 스티커 ───────── */
  .sticker{position:absolute; z-index:20;}
  .sticker .frame{width:100%; height:100%; position:relative; overflow:hidden; border-radius:6px;}
  .sticker .st-del{
    position:absolute; top:-9px; right:-9px; width:18px; height:18px; border-radius:50%;
    background:#7cb0e8; color:#fff; font-size:10px; line-height:18px; text-align:center;
    cursor:pointer; display:none; z-index:9; font-family:'Galmuri11',monospace;
  }
  .sticker .st-size{
    position:absolute; right:-8px; bottom:-8px; width:16px; height:16px; border-radius:4px;
    background:#7cb0e8; cursor:nwse-resize; display:none; z-index:9;
  }
  .sticker .st-move{
    position:absolute; top:-9px; left:-9px; width:18px; height:18px; border-radius:4px;
    background:#7cb0e8; color:#fff; font-size:10px; line-height:18px; text-align:center;
    cursor:move; display:none; z-index:9; font-family:'Galmuri11',monospace;
  }
  .sticker:hover .st-del, .sticker:hover .st-size, .sticker:hover .st-move,
  .sticker.sel .st-del, .sticker.sel .st-size, .sticker.sel .st-move{display:block;}
  .sticker.sel{outline:1px dashed #7cb0e8; outline-offset:3px;}

  /* ───────── 색칠 툴바 ───────── */
  #hlbar{
    position:fixed; z-index:999; display:none; gap:4px; align-items:center;
    background:#fff; border:2px solid #7cb0e8; border-radius:8px; padding:5px 7px;
    box-shadow:0 4px 14px rgba(70,110,160,0.22);
    font-family:'Galmuri11',monospace; font-size:10px;
  }
  #hlbar .cap{color:#8ea3c0; margin:0 2px;}
  #hlbar .sw{
    width:22px; height:18px; border-radius:4px; border:1px solid #cfe0f5; cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:10px;
  }
  #hlbar .sw.f1{background:var(--c1);}
  #hlbar .sw.f2{background:var(--c2);}
  #hlbar .sw.f3{background:var(--c3);}
  #hlbar .sw.t1{background:#fff; color:var(--c1t);}
  #hlbar .sw.t2{background:#fff; color:var(--c2t);}
  #hlbar .sw.t3{background:#fff; color:var(--c3t);}

  .save-btn{
    padding:12px 34px; font-size:12px; border-radius:8px;
    background:#7cb0e8; border:2px solid #5f97d4; color:#fff;
  }
  .save-btn:hover{background:#5f97d4;}
</style>
</head>
<body>

<!-- ══════════ 컨트롤 패널 ══════════ -->
<div class="panel">
  <div class="grp">
    <button id="addStickerBtn" type="button">＋ PNG 스티커</button>
  </div>
  <div class="grp">
    <label>배경</label><input type="color" id="cBg" value="#eef4fd">
    <label>도트</label><input type="color" id="cDot" value="#c9dcf6">
    <label>크기</label><input type="range" id="dotSize" min="2" max="18" step="0.5" value="6.5" title="도트 크기">
    <label>간격</label><input type="range" id="dotGap" min="26" max="130" step="1" value="55" title="도트 간격">
    <label>창선</label><input type="color" id="cLine" value="#7cb0e8">
    <label>글자</label><input type="color" id="cInk" value="#3f4d5e">
  </div>
  <div class="grp">
    <label>색1</label><input type="color" id="cC1" value="#a9d3f4">
    <label>색2</label><input type="color" id="cC2" value="#c5b0ec">
    <label>색3</label><input type="color" id="cC3" value="#f7c3d8">
  </div>
  <div class="grp">
    <label>폰트</label>
    <select id="fontSel">
      <option value="Galmuri14">Galmuri14</option>
      <option value="Galmuri11">Galmuri11</option>
      <option value="Galmuri9">Galmuri9</option>
      <option value="GalmuriMono11">GalmuriMono11</option>
    </select>
    <label>보기</label>
    <select id="zoomSel">
      <option value="1">100%</option>
      <option value="0.85">85%</option>
      <option value="0.7" selected>70%</option>
      <option value="0.55">55%</option>
    </select>
    <button id="resetBtn" type="button">색 초기화</button>
  </div>
  <div class="grp">
    <span class="save-state" id="saveState">자동 저장 준비 중…</span>
    <button id="resetAllBtn" class="danger" type="button">전체 초기화</button>
  </div>
</div>
<div class="hint">
  글자는 클릭해서 바로 고치면 되고, 드래그로 선택하면 색칠 툴바가 뜹니다<br>
  사진은 드래그로 위치 이동 / 휠로 확대·축소 / <b>더블클릭하면 다른 사진으로 교체</b><br>
  스티커는 왼쪽 위 ✥ 손잡이를 끌어서 옮깁니다<br>
  작성한 내용은 이 브라우저에 자동 저장돼요 · 처음 상태로 돌리려면 <b>전체 초기화</b>
</div>

<!-- ══════════ 스테이지 ══════════ -->
<div class="stage-wrap">
<div class="zoomer" id="zoomer">
<div class="stage" id="stage">

  <!-- 왼쪽 열 -->
  <div class="left-col">
    <div class="profile" id="profile"></div>
    <div class="info-box">
      <div id="infoItems"></div>
      <div class="adder ui-only" style="margin-top:14px;">
        <button class="mini" id="addBlkBtn" type="button">＋ 칸</button>
        <button class="mini" id="addSepBtn" type="button">＋ 구분선</button>
      </div>
    </div>
  </div>

  <!-- 오른쪽 창 -->
  <div class="win">
    <div class="win-bar">
      <svg class="ic" viewBox="0 0 24 24"><!-- 닫기 -->
        <path data-s="1" fill="none" stroke-width="2.8" stroke-linecap="round" d="M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4"/>
      </svg>
      <svg class="ic" viewBox="0 0 24 24"><!-- 새로고침 -->
        <path data-s="1" fill="none" stroke-width="2.4" stroke-linecap="round" d="M19.6 13.6A7.7 7.7 0 1 1 17.2 6.8"/>
        <path data-f="1" d="M18.0 2.7l1.6 5.5-5.5-1.1z"/>
      </svg>
      <svg class="ic" viewBox="0 0 24 24"><!-- 폴더 -->
        <path data-s="1" fill="none" stroke-width="2" stroke-linejoin="round"
              d="M3.2 7.4A1.6 1.6 0 0 1 4.8 5.8h3.9l1.9 2.2h8.6a1.6 1.6 0 0 1 1.6 1.6v7.8a1.6 1.6 0 0 1-1.6 1.6H4.8a1.6 1.6 0 0 1-1.6-1.6V7.4z"/>
      </svg>
      <svg class="ic" viewBox="0 0 24 24"><!-- 피드 -->
        <circle data-f="1" cx="5.8" cy="18.2" r="2.2"/>
        <path data-s="1" fill="none" stroke-width="2.3" stroke-linecap="round" d="M4 11.4a8.8 8.8 0 0 1 8.8 8.8"/>
        <path data-s="1" fill="none" stroke-width="2.3" stroke-linecap="round" d="M4 5.2a15 15 0 0 1 15 15"/>
      </svg>
    </div>

    <div class="win-body">
      <!-- 범례 -->
      <div class="legend" id="legend">
        <div class="deco" contenteditable="true" data-ph="장식 문구">(3 づ)3 ≡ •°｡*+°｡*+°｡ ▯▮▯▮▯▮</div>
      </div>
      <div class="adder ui-only" style="margin:-8px 0 10px;">
        <button class="mini" id="addLgBtn2" type="button">＋ 범례</button>
      </div>

      <!-- 섹션들 -->
      <div id="sections"></div>

      <div class="adder ui-only">
        <button class="mini" id="addSecBtn2" type="button">＋ 섹션</button>
      </div>

      <hr class="divider">

      <!-- 캐릭터 -->
      <div class="chars" id="chars"></div>
      <div class="adder ui-only" style="text-align:center;">
        <button class="mini" id="addCharBtn2" type="button">＋ 캐릭터 추가</button>
        <span class="lbl">한 줄에</span>
        <select class="mini-sel" id="perRowSel">
          <option value="auto">자동</option>
          <option value="2">2칸</option>
          <option value="3">3칸</option>
          <option value="4">4칸 (작게)</option>
        </select>
      </div>
    </div>

    <div class="win-foot">
      <svg class="ic" viewBox="0 0 24 24"><!-- 붓 -->
        <path data-f="1" d="M20.9 3.1a2.1 2.1 0 0 0-2.9 0l-7.6 7.6 2.9 2.9 7.6-7.6a2.1 2.1 0 0 0 0-2.9z"/>

<script>
/* ══════════════════════════════════════════════
   0. 공통 유틸
   ══════════════════════════════════════════════ */
const root  = document.documentElement;
const stage = document.getElementById('stage');

/* 스테이지를 축소해서 보고 있을 때도 마우스 이동량이 어긋나지 않도록 배율로 나눠 씀 */
function curZoom(){
  const v = parseFloat(document.getElementById('zoomSel').value);
  return v > 0 ? v : 1;
}

function hexToRgb(hex){
  const c = hex.replace('#','');
  const n = parseInt(c.length === 3 ? c.split('').map(x=>x+x).join('') : c, 16);
  return { r:(n>>16)&255, g:(n>>8)&255, b:n&255 };
}
/* 색칠용 밝은 색에서 글자용 진한 색을 자동으로 만들어 둠 */
function darken(hex, k){
  const {r,g,b} = hexToRgb(hex);
  const f = v => Math.max(0, Math.round(v*k));
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}
/* 배경 물방울 무늬: html2canvas가 확실히 그려주도록 SVG를 배경 이미지로 사용.
   네 모서리 + 한가운데에 점을 찍은 타일을 반복하면 어긋남 없이 딱 맞물려서
   전체가 고른 마름모 격자가 된다. (모서리 점은 네 타일이 1/4씩 나눠 그림)
   gap = 타일 한 변, 점 사이 실제 간격은 gap/√2 */
function dotsBg(color, r, gap){
  const T  = Math.round(gap);
  /* 이웃한 점 사이가 T/√2 이므로, 그 절반을 넘으면 서로 붙어버린다 */
  const rr = Math.min(r, T * 0.34).toFixed(2);
  const dot = (x, y) =>
    "<circle cx='" + x + "' cy='" + y + "' r='" + rr + "' fill='" + color + "'/>";
  const svg = "<svg xmlns='http://www.w3.org/2000/svg' width='" + T + "' height='" + T + "'>" +
              dot(0, 0) + dot(T, 0) + dot(0, T) + dot(T, T) + dot(T/2, T/2) +
              "</svg>";
  return 'url("data:image/svg+xml,' + encodeURIComponent(svg) + '")';
}

/* 붙여넣기는 서식 없이 (엉뚱한 폰트/색이 딸려오는 것 방지) */
stage.addEventListener('paste', e => {
  const host = e.target.closest && e.target.closest('[contenteditable="true"]');
  if (!host) return;
  e.preventDefault();
  const text = (e.clipboardData || window.clipboardData).getData('text');
  document.execCommand('insertText', false, text);
});

/* 큰 사진은 긴 변 1600px로 줄여서 넣는다. 저장 이미지(최대 2배율)에는 충분하고
   자동 저장 용량과 html2canvas 속도를 아낄 수 있다. 투명 PNG는 PNG 그대로 둠 */
function shrinkImage(dataUrl, type){
  return new Promise(resolve => {
    const im = new Image();
    im.onload = () => {
      const MAX = 1600, w = im.naturalWidth, h = im.naturalHeight;
      const k = MAX / Math.max(w, h);
      if (!(k < 1)) return resolve(dataUrl);          // 이미 작거나 크기를 모르면(SVG) 그대로
      const cv = document.createElement('canvas');
      cv.width = Math.round(w * k); cv.height = Math.round(h * k);
      cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
      resolve(type === 'image/jpeg' ? cv.toDataURL('image/jpeg', 0.9) : cv.toDataURL('image/png'));
    };
    im.onerror = () => resolve(dataUrl);
    im.src = dataUrl;
  });
}

/* ══════════════════════════════════════════════
   1. 이미지 프레임 (드래그 이동 + 휠 확대/축소)
   ══════════════════════════════════════════════ */
function makeFrame(frameEl, phText){
  const st = { x:0, y:0, s:1 };
  let img = null;

  frameEl.classList.add('frame','empty');
  frameEl.style.position = 'relative';

  const ph = document.createElement('div');
  ph.className = 'ph';
  ph.innerHTML = phText;
  frameEl.appendChild(ph);

  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*'; input.style.display = 'none';
  frameEl.appendChild(input);

  const ui = document.createElement('div');
  ui.className = 'fr-ui ui-only';
  ui.innerHTML = '<button class="mini" data-a="edit" type="button">↻</button>' +
                 '<button class="mini" data-a="del" type="button">✕</button>';
  frameEl.appendChild(ui);
  ui.addEventListener('mousedown', e => e.stopPropagation());
  ui.addEventListener('click', e => {
    const a = e.target.dataset.a;
    if (a === 'edit') input.click();
    if (a === 'del') {
      if (img) img.remove();
      img = null;
      frameEl.classList.add('empty');
      ph.style.display = '';
      st.x = st.y = 0; st.s = 1;
    }
  });

  function apply(){
    if (img) img.style.transform =
      `translate(-50%,-50%) translate(${st.x}px, ${st.y}px) scale(${st.s})`;
  }

  /* 프레임을 꽉 채우도록 기본 크기 계산. keep이면 저장해 둔 위치·배율을 유지 */
  function fit(keep){
    const fw = frameEl.clientWidth, fh = frameEl.clientHeight;
    const iw = img.naturalWidth, ih = img.naturalHeight;
    if (!iw || !ih) return;
    const base = Math.max(fw/iw, fh/ih);
    img.style.width  = (iw*base) + 'px';
    img.style.height = (ih*base) + 'px';
    if (!keep) { st.x = st.y = 0; st.s = 1; }
    apply();
  }

  /* 사진 넣기 — 파일로 올릴 때와 저장본을 되살릴 때 모두 여기로 온다.
     되살릴 때는 위치·배율을 onload 전에 먼저 채워 둬서, 그 사이에 자동 저장이
     돌더라도 기본값(0,0,1)으로 덮어쓰지 않게 함 */
  function setImage(src, saved){
    if (!img) { img = document.createElement('img'); frameEl.appendChild(img); }
    frameEl.classList.remove('empty');
    ph.style.display = 'none';
    if (saved) { st.x = saved.x || 0; st.y = saved.y || 0; st.s = saved.s || 1; }
    img.onload = () => fit(!!saved);
    img.src = src;
  }
  frameEl._getImg = () => img ? { src: img.src, x: st.x, y: st.y, s: st.s } : null;
  frameEl._load   = d => { if (d && d.src) setImage(d.src, d); };

  input.addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const fr = new FileReader();
    fr.onload = async ev => setImage(await shrinkImage(ev.target.result, file.type));
    fr.readAsDataURL(file);
    input.value = '';
  });

  frameEl.addEventListener('click', e => {
    if (!img && !e.target.closest('.fr-ui')) input.click();
  });
  /* 사진이 이미 있을 때는 클릭이 위치 조절(드래그)이라 겹치지 않게 더블클릭으로 교체 */
  frameEl.addEventListener('dblclick', e => {
    if (!e.target.closest('.fr-ui')) input.click();
  });

  /* 드래그 이동 */
  let dragging = false, sx = 0, sy = 0, ox = 0, oy = 0;
  frameEl.addEventListener('mousedown', e => {
    if (!img || e.target.closest('.fr-ui') || e.altKey) return;
    dragging = true;
    sx = e.clientX; sy = e.clientY; ox = st.x; oy = st.y;
    frameEl.classList.add('dragging');
    e.preventDefault();
  });
  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    const z = curZoom();
    st.x = ox + (e.clientX - sx) / z;
    st.y = oy + (e.clientY - sy) / z;
    apply();
  });
  window.addEventListener('mouseup', () => {
    dragging = false; frameEl.classList.remove('dragging');
  });

  /* 휠 확대/축소 */
  frameEl.addEventListener('wheel', e => {
    if (!img) return;
    e.preventDefault();
    st.s = Math.min(Math.max(st.s + (e.deltaY > 0 ? -0.08 : 0.08), 0.2), 6);
    apply();
  }, { passive:false });

  return frameEl;
}

/* ══════════════════════════════════════════════
   1-2. 왼쪽 소개표 (칸 · 구분선 추가/삭제)
   ══════════════════════════════════════════════ */
const infoItems = document.getElementById('infoItems');

  infoItems.appendChild(wrap);
  return wrap;

const addBlk = html => addInfoItem('<div class="blk" contenteditable="true" data-ph="문구"></div>', html);

document.getElementById('addBlkBtn').addEventListener('click', () => {
  addBlk('').querySelector('.blk').focus();

/* ══════════════════════════════════════════════
   2. 범례
   ══════════════════════════════════════════════ */
const legend = document.getElementById('legend');

function addLegend(colorClass, text){

  item.innerHTML =

    '<div class="lg-txt" contenteditable="true" data-ph="설명"></div>' +
    '<div class="row-ui ui-only">' +
      '<button class="mini" data-a="c" type="button">색</button>' +
      '<button class="mini" data-a="x" type="button">✕</button>' +
    '</div>';
  item.querySelector('.lg-txt').innerHTML = text || '';
  legend.appendChild(item);

  item.querySelector('.row-ui').addEventListener('click', e => {

      const order = ['c1','c2','c3'];
      const cur = order.findIndex(c => sw.classList.contains(c));
      sw.classList.remove(order[cur]);
      sw.classList.add(order[(cur+1) % order.length]);
    }
  });

}

/* ══════════════════════════════════════════════
   3. 섹션 / 줄
   ══════════════════════════════════════════════ */
const sections = document.getElementById('sections');

function addLine(sec, html){
  const line = document.createElement('div');
  line.className = 'line';
  line.innerHTML =
    '<div class="line-txt" contenteditable="true" data-ph="내용을 입력하세요"></div>' +

function addSection(title, lines){

    '<div class="lines"></div>' +
    '<div class="adder ui-only"><button class="mini" data-a="add" type="button">＋ 줄</button></div>' +
    '<div class="sec-ui ui-only"><button class="mini" data-a="del" type="button">섹션 ✕</button></div>';
  sec.querySelector('.sec-title').innerHTML = title || '';
  sections.appendChild(sec);

  (lines || ['']).forEach(h => addLine(sec, h));

  sec.querySelector('.adder').addEventListener('click', () => {
    const l = addLine(sec, '');
    l.querySelector('.line-txt').focus();
  });
  sec.querySelector('.sec-ui').addEventListener('click', () => sec.remove());
  return sec;
}

/* ══════════════════════════════════════════════
   4. 캐릭터 카드
   ══════════════════════════════════════════════ */
const chars = document.getElementById('chars');

function addChar(data){
  data = data || {};
  const card = document.createElement('div');
  card.className = 'char';
  card.innerHTML =
    '<div class="avatar"></div>' +
    '<div class="meta">' +
      '<div class="src"  contenteditable="true" data-ph="[출처]"></div>' +
      '<div class="desc" contenteditable="true" data-ph="작품명 - 캐릭터"></div>' +
      '<div class="note" contenteditable="true" data-ph=""></div>' +
    '</div>' +
    '<div class="card-ui ui-only">' +
      '<button class="mini" data-a="left" type="button">◀</button>' +
      '<button class="mini" data-a="right" type="button">▶</button>' +
      '<button class="mini" data-a="del" type="button">✕</button>' +
    '</div>';

  card.querySelector('.src').innerHTML  = data.src  || '';
  card.querySelector('.desc').innerHTML = data.desc || '';
  card.querySelector('.note').innerHTML = data.note || '';

  chars.appendChild(card);
  makeFrame(card.querySelector('.avatar'), '캐릭터<br>이미지');

  card.querySelector('.card-ui').addEventListener('click', e => {
    const a = e.target.dataset.a;
    if (!a) return;
    if (a === 'del')  card.remove();
    if (a === 'left'  && card.previousElementSibling) chars.insertBefore(card, card.previousElementSibling);
    if (a === 'right' && card.nextElementSibling)     chars.insertBefore(card.nextElementSibling, card);
  });

  return card;
}

/* ══════════════════════════════════════════════
   5. 스티커 (자유 배치 PNG)
   ══════════════════════════════════════════════ */
let selectedSticker = null;

function addSticker(x, y, w){
  const st = document.createElement('div');
  st.className = 'sticker';
  st.style.left = x + 'px';
  st.style.top  = y + 'px';
  st.style.width  = w + 'px';
  st.style.height = w + 'px';
  st.innerHTML =
    '<div class="inner"></div>' +
    '<div class="st-move ui-only" title="드래그해서 옮기기">✥</div>' +
    '<div class="st-del ui-only">✕</div>' +
    '<div class="st-size ui-only"></div>';
  stage.appendChild(st);

  const inner = st.querySelector('.inner');
  makeFrame(inner, 'PNG');

  st.querySelector('.st-del').addEventListener('click', e => { e.stopPropagation(); st.remove(); });

  /* 스티커 이동: 왼쪽 위 ✥ 손잡이를 끌거나, Alt + 아무데나 드래그.
     (프레임 안쪽 그냥 드래그는 사진 위치 조절이라 겹치지 않게 나눠 둠) */
  let mv = false, mx = 0, my = 0, ml = 0, mt = 0;
  function startMove(e){
    mv = true;
    mx = e.clientX; my = e.clientY;
    ml = st.offsetLeft; mt = st.offsetTop;
    select(st);
    e.preventDefault(); e.stopPropagation();
  }
  st.querySelector('.st-move').addEventListener('mousedown', startMove);
  st.addEventListener('mousedown', e => { if (e.altKey) startMove(e); });

  window.addEventListener('mousemove', e => {
    if (!mv) return;
    const z = curZoom();
    st.style.left = (ml + (e.clientX - mx) / z) + 'px';
    st.style.top  = (mt + (e.clientY - my) / z) + 'px';
  });
  window.addEventListener('mouseup', () => { mv = false; });

  /* 크기 조절 */
  const handle = st.querySelector('.st-size');
  let rs = false, sw0 = 0, sx0 = 0, sy0 = 0;
  handle.addEventListener('mousedown', e => {
    rs = true; sw0 = st.offsetWidth; sx0 = e.clientX; sy0 = e.clientY;
    e.preventDefault(); e.stopPropagation();
  });
  window.addEventListener('mousemove', e => {
    if (!rs) return;
    const z = curZoom();
    const d = (((e.clientX - sx0) + (e.clientY - sy0)) / 2) / z;
    const nw = Math.min(Math.max(sw0 + d, 40), 700);
    st.style.width = nw + 'px';
    st.style.height = nw + 'px';
  });
  window.addEventListener('mouseup', () => { rs = false; });

  st.addEventListener('click', () => select(st));
  select(st);
  return st;
}

function select(st){
  if (selectedSticker) selectedSticker.classList.remove('sel');
  selectedSticker = st;
  if (st) st.classList.add('sel');
}
document.addEventListener('click', e => {
  if (!e.target.closest('.sticker')) select(null);
});

/* ══════════════════════════════════════════════
   6. 색칠 툴바
   ══════════════════════════════════════════════ */
const hlbar = document.getElementById('hlbar');

function editableHost(node){
  const el = node && (node.nodeType === 1 ? node : node.parentElement);
  return el ? el.closest('[contenteditable="true"]') : null;
}

document.addEventListener('selectionchange', () => {
  const sel = window.getSelection();
  if (!sel || sel.rangeCount === 0 || sel.isCollapsed) { hlbar.style.display = 'none'; return; }
  const host = editableHost(sel.anchorNode);
  if (!host || !stage.contains(host)) { hlbar.style.display = 'none'; return; }
  const r = sel.getRangeAt(0).getBoundingClientRect();
  if (!r.width && !r.height) { hlbar.style.display = 'none'; return; }
  hlbar.style.display = 'flex';
  const bw = hlbar.offsetWidth || 240;
  hlbar.style.left = Math.max(8, Math.min(window.innerWidth - bw - 8, r.left + r.width/2 - bw/2)) + 'px';
  hlbar.style.top  = Math.max(8, r.top - hlbar.offsetHeight - 8) + 'px';
});

function unwrap(el){
  const p = el.parentNode;
  while (el.firstChild) p.insertBefore(el.firstChild, el);
  p.removeChild(el);
  p.normalize();
}

hlbar.addEventListener('mousedown', e => e.preventDefault()); // 선택 유지
hlbar.addEventListener('click', e => {
  const sw = e.target.closest('.sw');
  if (!sw) return;
  const sel = window.getSelection();
  if (!sel || sel.rangeCount === 0 || sel.isCollapsed) return;
  const range = sel.getRangeAt(0);
  const host = editableHost(range.commonAncestorContainer);
  if (!host) return;

  if (sw.dataset.act === 'clear') {
    host.querySelectorAll('.hl, .tx').forEach(el => {
      if (range.intersectsNode(el)) unwrap(el);
    });
    const inside = editableHost(range.startContainer);
    const near = range.startContainer.parentElement &&
                 range.startContainer.parentElement.closest('.hl, .tx');
    if (near && inside && inside.contains(near)) unwrap(near);
    hlbar.style.display = 'none';
    return;
  }

  const span = document.createElement('span');
  span.className = (sw.dataset.act === 'fill' ? 'hl ' : 'tx ') + sw.dataset.c;
  try {
    range.surroundContents(span);
  } catch (err) {
    span.appendChild(range.extractContents());
    range.insertNode(span);
  }
  sel.removeAllRanges();
  hlbar.style.display = 'none';
});

/* ══════════════════════════════════════════════
   7. 색 / 폰트 / 확대 컨트롤
   ══════════════════════════════════════════════ */
const DEFAULTS = {
  bg:'#eef4fd', dot:'#c9dcf6', line:'#7cb0e8', ink:'#3f4d5e',
  c1:'#a9d3f4', c2:'#c5b0ec', c3:'#f7c3d8'
};
const pickers = {
  bg:  document.getElementById('cBg'),
  dot: document.getElementById('cDot'),
  line:document.getElementById('cLine'),
  ink: document.getElementById('cInk'),
  c1:  document.getElementById('cC1'),
  c2:  document.getElementById('cC2'),
  c3:  document.getElementById('cC3')
};

function applyColors(){
  root.style.setProperty('--bg',   pickers.bg.value);
  root.style.setProperty('--line', pickers.line.value);
  root.style.setProperty('--ink',  pickers.ink.value);

  /* 창 상·하단 바: 위가 창선 색으로 진하고 아래로 갈수록 밝아지는 세로 그라데이션.
     두 바 모두 같은 방향이라 창이 위에서 빛을 받는 것처럼 보임 */
  const L = hexToRgb(pickers.line.value);
  const t = a => `rgba(${L.r},${L.g},${L.b},${a})`;

  /* 점선 테두리(왼쪽 소개표 / 오른쪽 이미지 칸)는 창선을 흰색 쪽으로 옅게 푼 색.
     창선을 그대로 쓰면 점선이 창 테두리만큼 진해져 시선을 뺏는다 */
  root.style.setProperty('--line-soft',
    `rgb(${Math.round(L.r + (255-L.r)*0.42)},${Math.round(L.g + (255-L.g)*0.42)},${Math.round(L.b + (255-L.b)*0.42)})`);
  const bar = `linear-gradient(180deg, ${t(0.55)}, ${t(0.08)} 75%, ${t(0.02)})`;
  root.style.setProperty('--bar-top', bar);
  root.style.setProperty('--bar-bot', bar);
  ['c1','c2','c3'].forEach(k => {
    root.style.setProperty('--' + k, pickers[k].value);
    root.style.setProperty('--' + k + 't', darken(pickers[k].value, 0.6));
  });
  stage.style.backgroundImage = dotsBg(pickers.dot.value, parseFloat(dotSize.value), parseFloat(dotGap.value));

  /* 창 위·아래 아이콘 색. html2canvas는 SVG를 별도 이미지로 그려서
     currentColor를 물려받지 못하므로 fill/stroke를 값으로 직접 박아 둔다 */
  document.querySelectorAll('.ic *').forEach(el => {
    if (el.dataset.f) el.setAttribute('fill',   pickers.line.value);
    if (el.dataset.s) el.setAttribute('stroke', pickers.line.value);
  });
}
const dotSize = document.getElementById('dotSize');
const dotGap  = document.getElementById('dotGap');
Object.values(pickers).forEach(p => p.addEventListener('input', applyColors));
[dotSize, dotGap].forEach(el => el.addEventListener('input', applyColors));

document.getElementById('resetBtn').addEventListener('click', () => {
  Object.keys(DEFAULTS).forEach(k => pickers[k].value = DEFAULTS[k]);
  dotSize.value = '6.5';
  dotGap.value  = '55';
  applyColors();
});

const fontSel = document.getElementById('fontSel');
fontSel.addEventListener('change', () => {
  root.style.setProperty('--font', "'" + fontSel.value + "'");
});

const zoomer = document.getElementById('zoomer');
const zoomSel = document.getElementById('zoomSel');
function applyZoom(){
  const z = parseFloat(zoomSel.value);
  zoomer.style.transform = 'scale(' + z + ')';
  zoomer.style.width  = (1200 * z) + 'px';
  zoomer.style.height = (stage.offsetHeight * z) + 'px';
}
zoomSel.addEventListener('change', applyZoom);
window.addEventListener('resize', applyZoom);

/* ══════════════════════════════════════════════
   8. 버튼 연결
   ══════════════════════════════════════════════ */
document.getElementById('addCharBtn2').addEventListener('click', () => addChar());

/* 한 줄에 몇 칸: 컨테이너 폭을 딱 N칸으로 묶어두면 flex-wrap이 알아서 줄을 나누고,
   4장을 2+2로, 5장을 3+2로 두는 식의 배치를 고를 수 있다 */
const perRowSel = document.getElementById('perRowSel');
const GAP = 18;
function applyPerRow(){
  const v = perRowSel.value;
  chars.dataset.per = v;
  if (v === 'auto') { chars.style.maxWidth = ''; return; }
  const n  = parseInt(v, 10);
  const cw = parseInt(getComputedStyle(chars).getPropertyValue('--cw'), 10);
  chars.style.maxWidth = (n * cw + (n - 1) * GAP) + 'px';
}
perRowSel.addEventListener('change', applyPerRow);
document.getElementById('addSecBtn2').addEventListener('click', () => addSection('[제목]', ['']));
document.getElementById('addLgBtn2').addEventListener('click', () => addLegend('c1', ''));
document.getElementById('addStickerBtn').addEventListener('click', () => addSticker(60, 60, 150));

/* ══════════════════════════════════════════════
   9. PNG 저장
   ══════════════════════════════════════════════ */
document.getElementById('saveBtn').addEventListener('click', async () => {
  const btn = document.getElementById('saveBtn');
  const prevZoom = zoomSel.value;
  const active = document.activeElement;
  if (active && active.blur) active.blur();

  btn.disabled = true;
  btn.textContent = '저장 중...';
  select(null);
  hlbar.style.display = 'none';
  stage.classList.add('capturing');
  zoomer.style.transform = 'none';
  zoomer.style.width = ''; zoomer.style.height = '';

  try {
    const canvas = await html2canvas(stage, {
      backgroundColor: pickers.bg.value,
      scale: 2,
      useCORS: true
    });
    const a = document.createElement('a');
    a.download = 'maintweet.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  } catch (err) {
    alert('저장에 실패했어요: ' + err);
  } finally {
    stage.classList.remove('capturing');
    zoomSel.value = prevZoom;
    applyZoom();
    btn.disabled = false;
    btn.textContent = 'PNG로 저장';
  }
});

/* ══════════════════════════════════════════════
   10. 초기 내용 (저장본이 없을 때만 씀)
   ══════════════════════════════════════════════ */

  addBlk('닉네임');
  addSep();
  addBlk('간단한 소개를 적어주세요<br>계정 설명, 연령, 성향 등등');

  addBlk('문의 · 연락 안내를<br>적어주세요');

  addLegend('c1', '최애');
  addLegend('c2', 'NG');

  addSection('<span class="hl c1">[분류명]</span>', [
    '여기에는 캐릭터, 페어, 장르를 넣어주세요',
    '작품명 / 장르 - <span class="hl c1">캐릭터명</span>',
    '작품명 / 장르 - <span class="hl c2">캐릭터명</span>'
  ]);

/* 왼쪽 프로필 사진 — 위치·크기는 고정, 안쪽 사진만 드래그/휠로 조절 */
makeFrame(document.getElementById('profile'), '프로필<br>사진');

/* ══════════════════════════════════════════════
   11. 자동 저장 — 이 브라우저의 IndexedDB에 한 덩어리로 보관
   사진(data URL)이 들어가면 localStorage(약 5MB)는 금방 넘쳐서 IndexedDB를 씀.
   브라우저마다 따로 저장되고 다른 사람과는 공유되지 않음
   ══════════════════════════════════════════════ */
const DB_NAME = 'maintweet-v2', DB_STORE = 'kv', DB_KEY = 'state';
let dbPromise = null;
function openDb(){
  if (!dbPromise) dbPromise = new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(DB_STORE);
    r.onsuccess = () => res(r.result);
    r.onerror   = () => rej(r.error);
  });
  return dbPromise;
}
async function dbRun(mode, fn){
  const db = await openDb();
  return new Promise((res, rej) => {
    const tx  = db.transaction(DB_STORE, mode);
    const req = fn(tx.objectStore(DB_STORE));
    tx.oncomplete = () => res(req.result);
    tx.onerror = tx.onabort = () => rej(tx.error);
  });
}
const loadState  = () => dbRun('readonly',  st => st.get(DB_KEY));
const writeState = v  => dbRun('readwrite', st => st.put(v, DB_KEY));
const clearState = () => dbRun('readwrite', st => st.delete(DB_KEY));

const innerOf = (el, sel) => el.querySelector(sel).innerHTML;
const imgOf   = el => (el && el._getImg) ? el._getImg() : null;

/* 화면 → 저장용 객체. 사진은 위치·배율까지 함께 */
function serialize(){
  const settings = {};
  Object.keys(pickers).forEach(k => settings[k] = pickers[k].value);
  Object.assign(settings, {
    dotSize: dotSize.value, dotGap: dotGap.value,
    font: fontSel.value, zoom: zoomSel.value, perRow: perRowSel.value
  });
  return {
    v: 1,
    settings,
    profile: imgOf(document.getElementById('profile')),
    info: [...infoItems.children].map(w => {
      const b = w.querySelector('.blk');
      return b ? { t:'blk', html:b.innerHTML } : { t:'sep' };
    }),
    deco: innerOf(document, '.deco'),
    legend: [...legend.querySelectorAll('.lg-item')].map(it => ({
      c: ['c1','c2','c3'].find(c => it.querySelector('.sw').classList.contains(c)) || 'c1',
      html: innerOf(it, '.lg-txt')
    })),
    sections: [...sections.querySelectorAll('.section')].map(sec => ({
      title: innerOf(sec, '.sec-title'),
      lines: [...sec.querySelectorAll('.line-txt')].map(l => l.innerHTML)
    })),
    chars: [...chars.querySelectorAll('.char')].map(c => ({
      src: innerOf(c, '.src'), desc: innerOf(c, '.desc'), note: innerOf(c, '.note'),
      img: imgOf(c.querySelector('.avatar'))
    })),
    stickers: [...stage.querySelectorAll('.sticker')].map(el => ({
      x: el.offsetLeft, y: el.offsetTop,
      w: parseFloat(el.style.width) || el.offsetWidth,
      img: imgOf(el.querySelector('.inner'))
    }))
  };
}

/* 저장용 객체 → 화면 */
function restoreState(d){
  const S = d.settings || {};
  Object.keys(pickers).forEach(k => { if (S[k]) pickers[k].value = S[k]; });
  if (S.dotSize) dotSize.value = S.dotSize;
  if (S.dotGap)  dotGap.value  = S.dotGap;
  if (S.font) { fontSel.value = S.font; root.style.setProperty('--font', "'" + fontSel.value + "'"); }
  if (S.zoom)    zoomSel.value   = S.zoom;
  if (S.perRow)  perRowSel.value = S.perRow;

  document.getElementById('profile')._load(d.profile);
  (d.info || []).forEach(it => it.t === 'sep' ? addSep() : addBlk(it.html));
  if (d.deco != null) document.querySelector('.deco').innerHTML = d.deco;
  (d.legend   || []).forEach(l => addLegend(l.c, l.html));
  (d.sections || []).forEach(sec => addSection(sec.title, sec.lines));
  (d.chars    || []).forEach(c => addChar(c).querySelector('.avatar')._load(c.img));
  (d.stickers || []).forEach(k => addSticker(k.x, k.y, k.w).querySelector('.inner')._load(k.img));
  select(null);
}

/* 복원 도중 깨지면 반쯤 만들어진 걸 치우고 기본값으로 */
function clearContent(){
  infoItems.innerHTML = '';
  legend.querySelectorAll('.lg-item').forEach(e => e.remove());
  sections.innerHTML = '';
  chars.innerHTML = '';
  stage.querySelectorAll('.sticker').forEach(e => e.remove());
}

const saveStateEl = document.getElementById('saveState');
let saveTimer = null, autosave = false;

function scheduleSave(){
  if (!autosave) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 400);
}
async function saveNow(){
  saveTimer = null;
  if (!autosave) return;
  try {
    await writeState(serialize());
    const t = new Date(), p = n => String(n).padStart(2, '0');
    saveStateEl.textContent = '✓ 자동 저장됨 ' + p(t.getHours()) + ':' + p(t.getMinutes());
  } catch (err) {
    saveStateEl.textContent = '⚠ 저장 실패 (저장공간 확인)';
  }
}

/* 글 수정·칸 추가/삭제·색칠·사진 이동/확대·스티커 이동은 전부 스테이지의 DOM 변화로 잡힘 */
new MutationObserver(scheduleSave)
  .observe(stage, { subtree:true, childList:true, characterData:true, attributes:true });
/* 색·도트 슬라이더·폰트·보기 배율·한 줄 칸 수 */
document.addEventListener('input',  scheduleSave, true);
document.addEventListener('change', scheduleSave, true);
/* 마지막 수정 후 400ms 안에 탭을 닫아도 남도록 */
window.addEventListener('pagehide', () => {
  if (saveTimer) { clearTimeout(saveTimer); saveNow(); }
});

document.getElementById('resetAllBtn').addEventListener('click', async () => {
  if (!confirm('작성한 글, 사진, 색·배치 설정이 모두 지워지고 처음 상태로 돌아갑니다.\n계속할까요?')) return;
  autosave = false;                 // 지우는 사이에 다시 저장되지 않게
  clearTimeout(saveTimer);
  try { await clearState(); } catch (err) {}
  location.reload();
});

/* ══════════════════════════════════════════════
   12. 시작
   ══════════════════════════════════════════════ */
(async () => {
  let saved = null, dbOk = true;
  try { saved = await loadState(); }
  catch (err) {
    dbOk = false;
    saveStateEl.textContent = '⚠ 이 브라우저에선 자동 저장을 쓸 수 없어요';
  }

  if (saved && saved.v === 1) {
    try { restoreState(saved); }
    catch (err) { clearContent(); buildDefaults(); }
  } else {
    buildDefaults();
  }

  applyColors();
  applyPerRow();
  applyZoom();

  /* 복원을 다 끝낸 다음부터 저장을 켠다 */
  autosave = dbOk;
  if (dbOk) saveStateEl.textContent = saved ? '✓ 저장본 불러옴' : '자동 저장 켜짐';
})();
</script>
